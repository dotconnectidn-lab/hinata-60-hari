name: Copy story to index
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy file
        run: cp hinata-60-hari.html index.html
      - name: Commit index
        run: |
          git config user.name "dotconnectidn-lab"
          git config user.email "dotconnectidn-lab@users.noreply.github.com"
          git add index.html
          git commit -m "Add index.html" || exit 0
          git push
